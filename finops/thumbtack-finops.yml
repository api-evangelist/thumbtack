description: >-
  FinOps view of Thumbtack spend is marketplace spend, not API-usage spend -
  Thumbtack has not published per-call or subscription pricing for its
  approval-gated Partner Platform. The dominant, quantified cost center is a
  pro's lead spend: pros pay per matched lead / customer opportunity at a
  dynamic price set weekly by category, job size, market, and competition
  (commonly cited in the roughly $8-$150+ per-lead range). Consumers incur no
  charge. Partner Platform integration costs (Demand API / Pro API) are
  negotiated per partnership agreement and are not published.
notes: >-
  No FOCUS-aligned unit pricing is published by Thumbtack for API consumption
  itself; the meters below track the marketplace lead spend that pros
  actually pay, since that is the only quantified cost Thumbtack discloses.
  Reconcile partner-agreement commercial terms directly with Thumbtack.
