meters:
- name: lead_charge
  description: Per-lead / per-opportunity charge to a pro when a homeowner responds or a request is delivered. Dynamic price set weekly by category, size, and market.
  unit: leads
  aggregation: sum
  dimensions:
  - pro_account
  - category
  - market
- name: partner_integration_fee
  description: Unpublished, negotiated commercial terms for Demand/Supply Partner API integrations (revenue share, referral fee, or flat agreement).
  unit: contracts
  aggregation: sum
  dimensions:
  - partner_account
principles:
- name: Visibility
  description: Pros can track per-lead charges in the Thumbtack app/dashboard; there is no published API-usage cost dashboard since API access is not metered publicly.
- name: Allocation
  description: Attribute lead spend to category/market/campaign so marketing spend maps to job categories and franchise/business units.
- name: Optimization
  description: Set target lead budgets and category/targeting preferences (the Pro API's targeting-preferences endpoints) to control which leads a pro is charged for.
- name: Accountability
  description: Assign an owner for lead-budget review per category/market; partner integrations should have a named commercial owner for the Thumbtack agreement.
