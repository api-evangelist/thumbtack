serviceCategory: Local Services Marketplace
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: On-Demand
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Adjustment
focusColumns:
  ServiceName: Thumbtack Pro Leads
  ServiceCategory: Local Services Marketplace
  ProviderName: Thumbtack
  PublisherName: Thumbtack
  InvoiceIssuerName: Thumbtack
  BillingCurrency: USD
