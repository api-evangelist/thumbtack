aid: thumbtack
url: https://raw.githubusercontent.com/api-evangelist/thumbtack/refs/heads/main/apis.yml
name: Thumbtack
kind: company
description: Thumbtack is a local services marketplace connecting homeowners with
  local service professionals (cleaning, home improvement, events, wellness, and
  more). There is no self-serve public API - Thumbtack operates an approval-gated
  Partner Platform (developers.thumbtack.com) with two documented API surfaces -
  a Demand API for marketplace integrations (pro search, categories, autocomplete,
  requests) and a Pro API for supply-side integrations (leads, messages, pro
  profiles, reviews) - plus low-code embeddable widgets. Access requires Thumbtack
  to approve a partner and issue OAuth 2.0 credentials; there is no public signup
  or API key self-service.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
