    type: OpenAPI
  description: Marketplace-side ("Demand Partner") integration surface for helping
    customers find pros, explore service categories, and submit project requests -
    pro search by zip code/category, filtered pro matching, autocomplete, homecare
    checklists, category recommendations, and on-demand order management. v1/v2
    routes use HTTP Basic auth; v4 routes use OAuth 2.0. Approval required; access
    is granted by Thumbtack after a partner application, not self-serve.
- aid: thumbtack:thumbtack-pro-api
  name: Thumbtack Pro API
  tags:
  - Leads
  - Messages
  - Pro Profiles
  - Reviews
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.thumbtack.com/docs/overview
  baseURL: https://pro-api.thumbtack.com
  properties:
  - url: https://developers.thumbtack.com/docs/overview
    type: Documentation
  - url: https://developers.thumbtack.com/guides/2Hqdq7prrqyDfW2HvoPRXb
    type: Documentation
  - url: https://pro-api.thumbtack.com/docs/
    type: APIReference
  - url: openapi/thumbtack-pro-openapi.yml
    type: OpenAPI
  description: Supply-side ("Supply Partner") integration surface launched 2021
    (first partner GoSite) letting business-workflow platforms manage a pro's
    Thumbtack leads and messages alongside their other customer communications -
    two-way lead messaging, business profile and targeting-preference management,
    review notifications, business phone numbers for call attribution, and job
    status signals. Thumbtack calls partner-implemented webhook-style endpoints
    (lead, message, lead update, review) and partners call Thumbtack's OAuth
    2.0-protected endpoints with a bearer token obtained via the
    partner-connect authorization code flow. Approval required.
